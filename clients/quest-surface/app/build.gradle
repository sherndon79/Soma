plugins {
    id 'com.android.application'
}

def questServerHost = providers.gradleProperty('questServerHost').orElse('127.0.0.1')
def questServerPort = providers.gradleProperty('questServerPort').orElse('8793')
def questTlsAssetsDir = providers.gradleProperty('questTlsAssetsDir')

android {
    namespace 'org.soma.questsurface'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'org.soma.questsurface'
        minSdk 32
        targetSdk 34
        versionCode 1
        versionName '0.1.0-v1a'

        buildConfigField 'String', 'QUEST_SERVER_HOST', "\"${questServerHost.get()}\""
        buildConfigField 'int', 'QUEST_SERVER_PORT', questServerPort.get()

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    sourceSets {
        main {
            if (questTlsAssetsDir.isPresent()) {
                // External, test-only mTLS identity. Never commit these files.
                assets.srcDir questTlsAssetsDir.get()
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.53'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
