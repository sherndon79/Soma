[package]
name = "soma-local-confirmation-issuer"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[[bin]]
name = "soma-local-confirmation-issuer"
path = "src/main.rs"

[[bin]]
name = "soma-local-confirmation-client"
path = "src/client.rs"

[dependencies]
hex = "0.4"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
